name: Backend checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: verdict
          POSTGRES_PASSWORD: verdict
          POSTGRES_DB: verdict_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U verdict -d verdict_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VERDICT_TEST_DATABASE_URL: postgresql+psycopg://verdict:verdict@localhost:5432/verdict_test
      VERDICT_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest
