[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdict-core"
version = "0.1.0"
description = "Explainable evidence infrastructure for confidence-aware oracle feeds"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "eth-abi>=5.2,<7",
  "eth-account>=0.13.7,<0.14",
  "eth-hash[pycryptodome]>=0.7,<1",
  "eth-keys>=0.8,<0.9",
  "eth-utils>=5,<7",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "redis>=6.4,<7",
  "rlp>=5,<6",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
  "websockets>=15,<18",
]

[project.scripts]
verdict = "verdict.cli:main"

[dependency-groups]
dev = ["eth-tester[py-evm]==0.13.0b1", "fakeredis>=2.31,<3", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/verdict"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
